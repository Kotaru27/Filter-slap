name: Public test-only ONNX smoke fixture (NOT trained)

on:
  push:
    branches:
      - research/public-untrained-onnx-lab-smoke
    paths:
      - '.github/workflows/public-untrained-onnx-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-non-trained-smoke-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate deterministic synthetic ONNX probe without any photos
        run: |
          python -m pip install 'onnx==1.17.0' 'numpy>=1.26,<3'
          python research/quality/create_test_only_onnx.py --output /tmp/onnx-fixtures
          test -s /tmp/onnx-fixtures/learned_global_predictor.onnx
      - name: Publish only untrained global model as a separate diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: UNTRAINED-ONNX-GLOBAL-IMPORT-SMOKE-TEST-NOT-PHOTO-QUALITY
          path: /tmp/onnx-fixtures/learned_global_predictor.onnx
          retention-days: 7
          if-no-files-found: error
