name: Build and verify debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'upgrade/**']

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
      - name: Prepare pinned pretrained V6 Android model assets
        run: |
          python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'onnx==1.17.0' 'onnxruntime==1.22.1'
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python research/v6/fetch_weights.py --output research/v6/model_weights
          python research/v6/export_android_model.py --model-dir research/v6/model_weights --output-dir app/src/main/assets
          python research/v7/prepare_assets.py --output-dir app/src/main/assets
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Run full Android unit tests (required; failures block APK)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Build independently signed debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK is present and nonempty
        run: test -s app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Verify signed APK and native alignment
        run: |
          APK=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Upload test reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload freshly built debug candidate
        uses: actions/upload-artifact@v4
        with:
          name: FilterSlap-V9-2-color-intent-EXPERIMENTAL-UNVERIFIED
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
