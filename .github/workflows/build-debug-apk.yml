name: Build and verify debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'upgrade/**']

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
      - name: Prepare pinned pretrained V6 Android model assets
        run: |
          python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'onnx==1.17.0' 'onnxruntime==1.22.1'
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python research/v6/fetch_weights.py --output research/v6/model_weights
          python research/v6/export_android_model.py --model-dir research/v6/model_weights --output-dir app/src/main/assets
          python research/v7/prepare_assets.py --output-dir app/src/main/assets
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Prepare public-domain real-photo inputs for review
        run: |
          python -m pip install 'scikit-image==0.25.2'
          python research/quality/prepare_public_photos.py --output-dir app/build/public-photo-input
      - name: Prepare controlled lighting-stress examples (research only)
        run: |
          python research/quality/prepare_lighting_stress.py \
            --input-dir app/build/public-photo-input \
            --reference-dir app/build/photo-lighting-references
      - name: Run full Android unit tests (required; failures block APK)
        env:
          PHOTO_COMPARE_INPUT: ${{ github.workspace }}/app/build/public-photo-input
          PHOTO_COMPARE_OUTPUT: ${{ github.workspace }}/app/build/public-photo-pairs
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Emit small public-photo before-after sheet for visual review
        run: |
          python research/quality/make_contact_sheet.py \
            --directory app/build/public-photo-pairs \
            --output app/build/public-photo-pairs/contact-sheet.jpg \
            --label "V9.4 selective illumination"
      - name: Build independently signed debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK is present and nonempty
        run: test -s app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Verify signed APK and native alignment
        run: |
          APK=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Verify installed APK version and give APK an unambiguous name
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "versionCode='13'"
          echo "$BADGING" | grep -F "versionName='1.5.4-v9.4-selective-illumination-experimental'"
          cp "$APK" app/build/outputs/apk/debug/FilterSlap-V9.4-experimental.apk
      - name: Upload test reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload unchanged public originals for stress-reference inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V9-4-UNEDITED-LIGHTING-REFERENCES-NOT-EXPERT-EDITS
          path: app/build/photo-lighting-references/
          if-no-files-found: warn
      - name: Upload before-after photo comparisons for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V9-4-EXPERIMENTAL-CC0-comparisons-REVIEW-REQUIRED
          path: app/build/public-photo-pairs/
          if-no-files-found: warn
      - name: Upload freshly built debug candidate
        uses: actions/upload-artifact@v4
        with:
          name: FilterSlap-V9.4-selective-illumination-EXPERIMENTAL
          path: app/build/outputs/apk/debug/FilterSlap-V9.4-experimental.apk
          if-no-files-found: error
